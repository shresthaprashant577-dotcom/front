<app-dashboard-layout
  title="Beneficiaries"
  subtitle="Manage your saved beneficiaries for quick transfers"
  [breadcrumbItems]="[
    { label: 'Dashboard', link: '/customer/dashboard' },
    { label: 'Beneficiaries' }
  ]"
  actionText="Add Beneficiary"
  (onAction)="addBeneficiary()"
>
  <!-- Add Beneficiary Form -->
  @if (showAddForm()) {
    <div class="card mb-6">
      <h3 class="text-lg font-medium text-gray-900 mb-4">Add New Beneficiary</h3>
      <form (ngSubmit)="saveBeneficiary()" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
            <input type="text" class="input-field" placeholder="Full name" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Account Number *</label>
            <input type="text" class="input-field" placeholder="Account number" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bank Name *</label>
            <input type="text" class="input-field" placeholder="Bank name" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bank Code *</label>
            <input type="text" class="input-field" placeholder="Routing number" required>
          </div>
        </div>
        <div class="flex space-x-4">
          <button type="submit" class="btn-primary">Save Beneficiary</button>
          <button type="button" (click)="showAddForm.set(false)" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  }

  <!-- Beneficiaries Table -->
  @if (isLoading()) {
    <div class="card text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
      <p class="mt-4 text-gray-600">Loading beneficiaries...</p>
    </div>
  } @else if (beneficiaries().length > 0) {
    <div class="card">
      <app-data-table
        [columns]="beneficiaryColumns"
        [data]="beneficiaries()"
        [trackBy]="'id'"
        [actions]="['edit', 'delete']"
      />
    </div>
  } @else {
    <div class="card text-center py-12">
      <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
      </svg>
      <h3 class="mt-2 text-sm font-medium text-gray-900">No beneficiaries</h3>
      <p class="mt-1 text-sm text-gray-500">Get started by adding your first beneficiary.</p>
      <div class="mt-6">
        <button (click)="addBeneficiary()" class="btn-primary">
          Add Beneficiary
        </button>
      </div>
    </div>
  }
</app-dashboard-layout>
